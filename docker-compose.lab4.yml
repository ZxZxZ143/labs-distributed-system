
services:
  s3:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: lab4user
      RUSTFS_SECRET_KEY: lab4password
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_VOLUMES: /data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - s3-data:/data
    restart: unless-stopped


  redis-primary:
    image: redis:7
    ports:
      - "127.0.0.1:16379:6379"
    restart: unless-stopped

  redis-replica:
    image: redis:7
    command: [ "redis-server", "--replicaof", "redis-primary", "6379" ]
    ports:
      - "127.0.0.1:16380:6379"
    depends_on:
      - redis-primary
    restart: unless-stopped


volumes:
  s3-data:
